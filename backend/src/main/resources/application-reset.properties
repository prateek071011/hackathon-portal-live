# Profile "reset": rebuilds the database with the demo data. EVERYTHING in the database is deleted first.
# Spring reads this file on top of application.properties only when the "reset" profile is switched on:
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=reset"
#   java -jar target\portal-1.0.0.jar --spring.profiles.active=reset
# Use it for the very first start and before a demo. Afterwards start normally, without the profile.

# 1. reset.sql drops every table, 2. schema.sql creates them again, 3. data.sql adds the demo rows.
spring.sql.init.schema-locations=classpath:reset.sql,classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
