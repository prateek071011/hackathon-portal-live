# Our own settings, loaded with java.util.Properties by config/PortalConfig.java.
# Folders are relative to the folder the backend is started from (backend/).

# Students get codes like HTF-7K3Q9M
portal.userCodePrefix=HTF-

# Profile pictures: where they are saved, the biggest allowed size (2 MB), allowed types
portal.uploadDir=data/uploads
portal.maxUploadBytes=2097152
portal.allowedPictureTypes=image/jpeg,image/png

# Serialized RegistrationSnapshot files ({registrationCode}.ser)
portal.snapshotDir=data/snapshots
