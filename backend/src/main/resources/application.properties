# Spring Boot settings. Our own app settings live in portal.properties (read by PortalConfig).

spring.application.name=htf-portal
server.port=8080

# Your own machine's secrets (e.g. the MySQL password) go in backend/local.properties.
# That file is not committed to git; copy local.properties.example to create it.
# Anything set there overrides the defaults below.
spring.config.import=optional:file:./local.properties

# --- Database: MySQL 8 on this machine -------------------------------------
# Dev defaults. Override with environment variables DB_URL / DB_USERNAME / DB_PASSWORD.
# createDatabaseIfNotExist=true makes MySQL create the htf_portal database on first start.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/htf_portal?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# schema.sql runs at every start: CREATE TABLE IF NOT EXISTS, so running it again changes nothing.
# data.sql (the demo rows) runs ONLY with the "reset" profile (application-reset.properties). An empty list here
# means a normal restart never re-inserts demo rows, so something you deleted stays deleted.
spring.sql.init.mode=always
spring.sql.init.data-locations=

# --- Logging: console + logs/app.log ---------------------------------------
logging.file.name=logs/app.log
logging.level.com.htf.portal=INFO

# --- CORS: only the Vite dev server may call the API ------------------------
portal.cors.allowed-origin=http://localhost:5173

# Spring Boot would otherwise create a default "user" account with a random password (and print it).
# We log people in with our own users table + JWT, so that default account is switched off.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# --- JWT login tokens -------------------------------------------------------
# Dev default only. In any real deployment set the JWT_SECRET environment variable (32+ characters).
portal.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789}
portal.jwt.expiry-hours=24

# --- File uploads -------------------------------------------------------------
# Spring's hard limit. It is a bit above our own 2 MB rule (portal.properties),
# so normally our friendlier "Picture is too large" message is the one users see.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
